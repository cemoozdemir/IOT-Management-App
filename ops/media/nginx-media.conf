#
# IoT Manager MediaMTX reverse-proxy snippet
#
# Include inside the HTTPS server block for:
#
#   iot.ozdmr.dev
#
# Public:
#   /media/webrtc/ -> MediaMTX WHEP/WebRTC HTTP
#   /media/hls/    -> MediaMTX HLS
#
# Never proxy:
#   127.0.0.1:9997  MediaMTX Control API
#   127.0.0.1:8554  internal RTSP
#

location ^~ /media/webrtc/ {
    proxy_pass http://127.0.0.1:8889/;

    #
    # proxy_pass strips /media/webrtc/.
    # MediaMTX can return relative Location headers for
    # WHEP sessions; restore the public prefix.
    #
    proxy_redirect / /media/webrtc/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    #
    # Forward only the browser's short-lived media token.
    #
    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location ^~ /media/hls/ {
    proxy_pass http://127.0.0.1:8888/;

    proxy_redirect / /media/hls/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    #
    # hls.js sends the current short-lived media token
    # on playlist, part and segment requests.
    #
    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Cache-Control "no-store" always;
}
